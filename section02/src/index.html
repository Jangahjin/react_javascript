<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    function addListEvent(){
    //1. 객체를 찾는다. (id = addList)
    const addList = document.getElementById("addList");
    let list = "";
    //2.<ul> <li>1</li> ~~ <li>3000</li> </ul>
    for(let index = 1; index <= 1000; index++){
     list += `<li>${index}</li>`;
    }
    //real Dom 적용
    addList.innerHTML = list;
  }
  </script>
</head>
<body>
  <button type="button" onclick="addListEvent()">리스트 추가</button>
  <ul id="addList"></ul>
</body>
</html>
